name: Claude

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      (github.event_name == 'issues' &&
        github.event.issue.author_association == 'OWNER' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' &&
        github.event.comment.author_association == 'OWNER' &&
        contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anthropics/claude-code-action@e2a4b761cd77a1138a5b41410eda9b28581f9bcd # v1.0.196
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # issue の新規作成（タイトル・本文の @claude）のときだけ CLAUDE.md の
          # 決まったフォーマットに従わせる。それ以降の issue コメントへの返信では
          # フォーマットを制限せず、コメント内容に応じて自然に返信する。
          prompt: ${{ github.event_name == 'issue_comment' && 'これは既存の issue に付いたフォローアップコメントへの返信です。CLAUDE.md の「コメントのフォーマット」で定められた 4 セクション構成（概要・何が嬉しいのか・詳細・参考リンク）に従う必要はありません。ユーザーのコメント内容に応じて、自然な形で技術的に返信してください。返信の前に `gh issue view <番号> --comments` で議論の流れを把握すること。新規 issue のような重複・関連ノートの一括確認やタイトルの変更は不要です。必ず日本語で回答し、不確かな情報は不確かであると明記してください。回答は必ず issue のコメントとして残すこと。最終メッセージに回答本文をそのまま書けば追跡コメントに反映されるので、`gh issue comment` で二重投稿しないこと。' || '' }}
          # issue_comment は prompt 指定により agent モードになり、追跡コメントが作られない。
          # その場合 Claude が gh issue comment を呼ばないと回答がどこにも残らないため、
          # track_progress で tag モードを強制して出力を必ずコメントとして投稿させる。
          track_progress: ${{ github.event_name == 'issue_comment' }}
          claude_args: |
            --allowedTools "Bash(gh label list:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),WebFetch,WebSearch"
